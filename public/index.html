<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon 3D Hands</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff}
  #video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.55;filter:saturate(.8) brightness(.8)}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
  #num{font-size:64px;font-weight:800;color:#0ff;text-shadow:0 0 12px #0ff,0 0 32px #08f,0 0 60px #08f}
  #hint{font-size:13px;opacity:.85;text-shadow:0 0 8px #f0f}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#1a0638,#05030f 70%);z-index:5;text-align:center;padding:24px}
  #start h1{margin:0;font-size:28px;color:#f0f;text-shadow:0 0 14px #f0f,0 0 40px #a0f}
  #start p{margin:0;opacity:.8;max-width:320px;font-size:14px;line-height:1.5}
  button{font-size:18px;font-weight:700;color:#fff;background:transparent;border:2px solid #0ff;border-radius:999px;padding:14px 36px;box-shadow:0 0 14px #0ff,inset 0 0 14px #0ff55;text-shadow:0 0 8px #0ff}
  button:active{transform:scale(.96)}
  #msg{color:#ff6b9d;font-size:13px;min-height:18px}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="skel"></canvas>
<div id="hud"><div id="num"></div><div id="hint"></div></div>
<div id="start">
  <h1>NEON 3D</h1>
  <p>Kameraga ruxsat bering va qo‘lingizni ko‘rsating. Barmoqlar soni 3D neon shakllar sonini belgilaydi.</p>
  <button id="go">Kamerani yoqish</button>
  <div id="msg"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){} }

const $ = id => document.getElementById(id);
const video = $('video'), numEl = $('num'), hintEl = $('hint');

/* ---------- THREE sahna ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
camera.position.z = 6;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const s = $('skel'); s.width = w; s.height = h;
}
addEventListener('resize', resize); resize();

const visH = () => 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

const root = new THREE.Group(); scene.add(root);

const kinds = [
  () => [new THREE.BoxGeometry(1, 1, 1), 'e'],
  () => [new THREE.OctahedronGeometry(0.8), 'e'],
  () => [new THREE.TetrahedronGeometry(0.9), 'e'],
  () => [new THREE.TorusGeometry(0.6, 0.22, 12, 28), 'w'],
  () => [new THREE.IcosahedronGeometry(0.8, 0), 'e'],
  () => [new THREE.DodecahedronGeometry(0.8), 'e'],
  () => [new THREE.TorusKnotGeometry(0.5, 0.16, 64, 8), 'w'],
  () => [new THREE.ConeGeometry(0.7, 1.3, 6), 'e'],
  () => [new THREE.CylinderGeometry(0.55, 0.55, 1.1, 8, 1), 'e'],
  () => [new THREE.IcosahedronGeometry(0.8, 1), 'w'],
];

function neonShape(geoFn, hue, scale = 1) {
  const [geo, mode] = geoFn();
  const color = new THREE.Color().setHSL(hue, 1, 0.55);
  const g = new THREE.Group();
  const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.1, depthWrite: false, blending: THREE.AdditiveBlending }));
  const lineGeo = mode === 'e' ? new THREE.EdgesGeometry(geo, 12) : new THREE.WireframeGeometry(geo);
  const mk = (s, o) => {
    const l = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false }));
    l.scale.setScalar(s); return l;
  };
  g.add(fill, mk(1, 1), mk(1.04, 0.35), mk(1.09, 0.15));
  g.userData = { color, scale, cur: 0 };
  g.scale.setScalar(0.0001);
  return g;
}

// 10 ta shakl + markaziy yadro
const shapes = [];
for (let i = 0; i < 10; i++) {
  const s = neonShape(kinds[i], (i / 10 + 0.5) % 1, 1);
  s.visible = false; root.add(s); shapes.push(s);
}
const core = neonShape(() => [new THREE.IcosahedronGeometry(0.45, 1), 'w'], 0.85, 1);
core.scale.setScalar(1); root.add(core);

// Zarrachalar (neon chang)
const PN = 260;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PN * 3), pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x66ffff, size: 0.05, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(particles);
let pi = 0;
function emit(p, n = 2) {
  for (let k = 0; k < n; k++) {
    const i = pi++ % PN;
    pPos[i*3] = p.x + (Math.random()-.5)*.5; pPos[i*3+1] = p.y + (Math.random()-.5)*.5; pPos[i*3+2] = p.z + (Math.random()-.5)*.5;
    pVel[i*3] = (Math.random()-.5)*.02; pVel[i*3+1] = (Math.random()-.5)*.02; pVel[i*3+2] = (Math.random()-.5)*.02;
    pLife[i] = 1;
  }
}

/* ---------- Qo'l ma'lumotlari ---------- */
const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z - b.z) * 0.5);

function countFingers(lm) {
  let n = 0;
  const w = lm[0];
  // 4 barmoq: uchi bilan bilak masofasi PIP bilak masofasidan katta
  [[8, 6], [12, 10], [16, 14], [20, 18]].forEach(([t, p]) => { if (d(lm[t], w) > d(lm[p], w) * 1.05) n++; });
  // bosh barmoq: uchi jimjiloq asosidan uzoqda
  if (d(lm[4], lm[17]) > d(lm[3], lm[17]) * 1.08 && d(lm[4], lm[5]) > d(lm[3], lm[5])) n++;
  return n;
}

const state = {
  hands: [], count: 0, hist: [],
  pos: new THREE.Vector3(0, 0, 0), tgtPos: new THREE.Vector3(),
  roll: 0, tgtRoll: 0, pinch: false, radius: 1.6, tgtRadius: 1.6, spin: 0, present: false,
};

function onResults(r) {
  state.hands = r.multiHandLandmarks || [];
}

function updateFromHands() {
  const hs = state.hands;
  state.present = hs.length > 0;
  if (!state.present) { hintEl.textContent = 'Qo‘lingizni kameraga ko‘rsating ✋'; return; }

  // barmoqlar soni (barqarorlashtirilgan)
  const total = hs.reduce((a, lm) => a + countFingers(lm), 0);
  state.hist.push(total); if (state.hist.length > 7) state.hist.shift();
  const freq = {}; state.hist.forEach(v => freq[v] = (freq[v] || 0) + 1);
  state.count = +Object.entries(freq).sort((a, b) => b[1] - a[1])[0][0];

  // markaz va chuqurlik
  const H = visH(), W = H * camera.aspect;
  let cx = 0, cy = 0, sz = 0;
  hs.forEach(lm => { cx += lm[9].x; cy += lm[9].y; sz += d(lm[0], lm[9]); });
  cx /= hs.length; cy /= hs.length; sz /= hs.length;
  state.tgtPos.set(0, (0.5 - cy) * H, THREE.MathUtils.clamp((sz - 0.16) * 14, -3, 3));
  // video ko'zguli: x ni teskari qilamiz
  state.tgtPos.x = ((1 - cx) - 0.5) * W;

  // burilish
  const lm0 = hs[0];
  state.tgtRoll = Math.atan2(-(lm0[9].x - lm0[0].x), -(lm0[9].y - lm0[0].y));

  // chimchilash
  state.pinch = d(lm0[4], lm0[8]) / Math.max(d(lm0[0], lm0[9]), 0.01) < 0.38;

  // ikki qo'l oralig'i
  if (hs.length === 2) {
    const dd = Math.hypot(hs[0][9].x - hs[1][9].x, hs[0][9].y - hs[1][9].y);
    state.tgtRadius = THREE.MathUtils.clamp(0.7 + dd * 3.2, 0.8, 3.2);
  } else state.tgtRadius = 1.6;
  if (state.count === 0) state.tgtRadius = 0.45;

  hintEl.textContent = state.pinch ? '🤏 Ushlab turibsiz' : (state.count === 0 ? '✊ Yig‘ildi' : hs.length === 2 ? '🙌 Qo‘llar oralig‘i = o‘lcham' : '🖐 Barmoq soni = shakllar');
}

/* ---------- Skelet chizish (neon nuqtalar) ---------- */
const sctx = $('skel').getContext('2d');
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawSkeleton() {
  const w = innerWidth, h = innerHeight;
  sctx.clearRect(0, 0, w, h);
  if (!state.hands.length) return;
  // object-fit: cover xaritasi
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const sc = Math.max(w / vw, h / vh), ox = (w - vw * sc) / 2, oy = (h - vh * sc) / 2;
  const P = p => [w - (p.x * vw * sc + ox), p.y * vh * sc + oy];
  sctx.lineWidth = 2; sctx.shadowBlur = 12;
  state.hands.forEach((lm, hi) => {
    const c = hi ? '#ff2bd6' : '#19f6ff';
    sctx.strokeStyle = c; sctx.fillStyle = c; sctx.shadowColor = c;
    CONN.forEach(([a, b]) => { const A = P(lm[a]), B = P(lm[b]); sctx.beginPath(); sctx.moveTo(...A); sctx.lineTo(...B); sctx.stroke(); });
    lm.forEach(p => { const [x, y] = P(p); sctx.beginPath(); sctx.arc(x, y, 3.5, 0, 6.283); sctx.fill(); });
  });
}

/* ---------- Animatsiya ---------- */
const clock = new THREE.Clock();
const fib = (i, n) => {
  const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), phi = i * 2.399963;
  return new THREE.Vector3(Math.cos(phi) * r, y, Math.sin(phi) * r);
};
const tmp = new THREE.Vector3();

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updateFromHands();

  const k = state.pinch ? 0.45 : 0.14;
  if (state.present) {
    state.pos.lerp(state.tgtPos, k);
    let dr = state.tgtRoll - state.roll; dr = Math.atan2(Math.sin(dr), Math.cos(dr));
    state.roll += dr * 0.15;
  } else {
    state.pos.lerp(tmp.set(Math.sin(t * 0.4) * 0.6, Math.cos(t * 0.3) * 0.4, 0), 0.03);
  }
  state.radius += (state.tgtRadius - state.radius) * 0.1;
  state.spin += dt * (state.count === 0 && state.present ? 4 : 0.7);

  root.position.copy(state.pos);
  root.rotation.z = -state.roll * 0.8;
  root.rotation.y = state.spin;
  root.rotation.x = Math.sin(t * 0.5) * 0.25;

  const n = state.present ? state.count : state.hist.length ? state.count : 0;
  shapes.forEach((s, i) => {
    const on = i < n;
    s.visible = on || s.userData.cur > 0.01;
    s.userData.cur += ((on ? 1 : 0) - s.userData.cur) * 0.12;
    const c = s.userData.cur;
    s.scale.setScalar(Math.max(c * (state.pinch ? 1.25 : 1) * 0.6, 0.0001));
    if (!on) return;
    const f = fib(i, Math.max(n, 2));
    s.position.copy(f).multiplyScalar(state.radius * (1 + Math.sin(t * 2 + i) * 0.06));
    s.rotation.x = t * (0.6 + i * 0.1); s.rotation.y = t * (0.8 - i * 0.05);
    const hue = (i / 10 + t * 0.05) % 1;
    s.children.forEach(ch => { if (ch.material) ch.material.color.setHSL(hue, 1, state.pinch ? 0.8 : 0.55); });
  });
  core.rotation.x = -t * 1.2; core.rotation.y = t * 0.9;
  core.scale.setScalar(0.9 + Math.sin(t * 3) * 0.08 + (state.count === 0 && state.present ? 0.5 : 0));
  core.children.forEach(ch => { if (ch.material) ch.material.color.setHSL((0.55 + t * 0.08) % 1, 1, 0.6); });

  // zarrachalar
  if (state.present) emit(root.position, state.pinch ? 5 : 2);
  const pa = pGeo.attributes.position.array;
  for (let i = 0; i < PN; i++) {
    if (pLife[i] > 0) {
      pLife[i] -= dt * 0.9;
      pa[i*3] += pVel[i*3]; pa[i*3+1] += pVel[i*3+1]; pa[i*3+2] += pVel[i*3+2];
    } else pa[i*3+1] = -999;
  }
  pGeo.attributes.position.needsUpdate = true;
  particles.material.color.setHSL((0.5 + t * 0.05) % 1, 1, 0.6);

  numEl.textContent = state.present ? state.count : '';
  drawSkeleton();
  renderer.render(scene, camera);
}
frame();

/* ---------- Kamera + MediaPipe ---------- */
$('go').addEventListener('click', async () => {
  const msg = $('msg'); msg.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
    });
    video.srcObject = stream; await video.play();
    $('go').disabled = true; $('go').textContent = 'Yuklanmoqda…';

    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    hands.onResults(onResults);
    await hands.initialize();

    $('start').style.display = 'none';
    let busy = false;
    const loop = async () => {
      if (video.readyState >= 2 && !busy) { busy = true; try { await hands.send({ image: video }); } catch (e) {} busy = false; }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    $('go').disabled = false; $('go').textContent = 'Qayta urinish';
    msg.textContent = e.name === 'NotAllowedError'
      ? 'Kamera ruxsati berilmadi. Telegram sozlamalaridan ruxsat bering.'
      : 'Xato: ' + (e.message || e.name);
  }
});
</script>
</body>
</html>
